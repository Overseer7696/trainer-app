<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренер">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Тренер</title>
<style>
/* ============================================================
   ПЕРЕМЕННЫЕ И ТЕМЫ
   ============================================================ */
:root {
  --bg: #f5f5f7;
  --bg-card: #ffffff;
  --bg-card-trans: rgba(255,255,255,0.92);
  --bg-header: #1a1a1a;
  --bg-input: #f5f5f7;
  --text: #1a1a1a;
  --text-muted: #777;
  --border: #e2e2e2;
  --accent: #ff6b35;
  --accent-hover: #e85a25;
  --success: #2e7d32;
  --success-bg: #e8f5e9;
  --warn: #e65100;
  --warn-bg: #fff3e0;
  --danger: #d32f2f;
  --danger-bg: #ffebee;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --radius: 12px;
}
[data-theme="dark"] {
  --bg: #0f0f0f;
  --bg-card: #1c1c1e;
  --bg-card-trans: rgba(28,28,30,0.85);
  --bg-header: #000000;
  --bg-input: #2c2c2e;
  --text: #f2f2f7;
  --text-muted: #8e8e93;
  --border: #2c2c2e;
  --accent: #ff7b45;
  --accent-hover: #ff8b55;
  --success: #4caf50;
  --success-bg: #1b3a1d;
  --warn: #ffb74d;
  --warn-bg: #3a2a15;
  --danger: #ff453a;
  --danger-bg: #3a1b1b;
  --shadow: 0 2px 8px rgba(0,0,0,0.5);
}

/* ============================================================
   БАЗА
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 90px;
  transition: background 0.2s, color 0.2s;
  overscroll-behavior-y: none;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* Фон для главной */
body[data-tab="dashboard"] {
  background-image:
    linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.75) 100%),
    url('https://images.pexels.com/photos/1552252/pexels-photo-1552252.jpeg?auto=compress&cs=tinysrgb&w=1200');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
body[data-tab="dashboard"] .tab-content { color: #fff; }

/* ============================================================
   ШАПКА
   ============================================================ */
.app-header {
  background: var(--bg-header);
  color: #fff;
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.logo { font-size: 17px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.header-spacer { flex: 1; }
.icon-btn-header {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn-header svg { width: 20px; height: 20px; }

/* ============================================================
   НИЖНЯЯ НАВИГАЦИЯ
   ============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
}
.nav-btn {
  flex: 1;
  background: transparent;
  border: none;
  padding: 8px 4px 10px;
  color: var(--text-muted);
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: color 0.15s;
}
.nav-icon {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  transition: stroke 0.15s;
}
.nav-btn.active { color: var(--accent); }

/* ============================================================
   КОНТЕНТ
   ============================================================ */
.app-main { max-width: 720px; margin: 0 auto; padding: 18px 14px; }
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.2s; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
h1 { font-size: 22px; margin-bottom: 16px; font-weight: 700; }
h2 { font-size: 17px; margin-bottom: 10px; }
h3 { font-size: 15px; margin-bottom: 8px; }

.tab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.tab-header h1 { margin: 0; }

/* ============================================================
   ДАШБОРД
   ============================================================ */
.dash-date {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 16px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

.dash-block {
  background: var(--bg-card-trans);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  color: var(--text);
}

.dash-block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.dash-block-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  text-transform: uppercase;
}

.dash-big-number {
  font-size: 26px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.1;
}

.dash-next {
  background: var(--bg-input);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 10px 0;
  border-left: 4px solid var(--accent);
}
.dash-next-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.dash-next-time {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}
.dash-next-name {
  font-size: 15px;
  font-weight: 600;
  margin: 2px 0;
}
.dash-next-muscles {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.dash-small-list {
  margin: 8px 0;
  padding-left: 0;
  list-style: none;
}
.dash-small-list li {
  font-size: 13px;
  color: var(--text-muted);
  padding: 4px 0;
  display: flex;
  gap: 8px;
}
.dash-small-list li b {
  color: var(--text);
  font-weight: 600;
  min-width: 44px;
}

.dash-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  margin-top: 8px;
  background: none;
  border: none;
  padding: 0;
}
.dash-link svg { width: 14px; height: 14px; }

.dash-info-list {
  list-style: none;
  padding: 0;
}
.dash-info-list li {
  font-size: 13px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  display: flex;
  gap: 8px;
}
.dash-info-list li:last-child { border-bottom: none; }
.dash-info-icon { flex-shrink: 0; }

.dash-btn-pulse {
  animation: pulse 1.8s ease-in-out infinite;
  box-shadow: 0 0 0 0 rgba(255,107,53,0.7);
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,107,53,0.7); }
  70% { box-shadow: 0 0 0 12px rgba(255,107,53,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,107,53,0); }
}

/* ============================================================
   КАРТОЧКИ / СПИСКИ
   ============================================================ */
.cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 8px;
  text-align: center;
  box-shadow: var(--shadow);
}
.card-icon-svg {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 6px;
  color: var(--accent);
}
.card-icon-svg svg { width: 28px; height: 28px; }
.card-value { font-size: 22px; font-weight: 700; color: var(--accent); }
.card-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.list-container { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform 0.1s;
  border-left: 4px solid var(--accent);
  cursor: pointer;
}
.list-item:active { transform: scale(0.98); }
.list-item-info { flex: 1; min-width: 0; }
.list-item-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-item-sub {
  font-size: 12px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-item-thumb {
  width: 56px;
  height: 56px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bg-input);
  flex-shrink: 0;
}
.list-item-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn {
  background: transparent;
  border: none;
  font-size: 16px;
  padding: 8px;
  border-radius: 8px;
  color: var(--text-muted);
}
.icon-btn:active { background: var(--border); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 14px;
}
.empty-state .emoji { font-size: 48px; display: block; margin-bottom: 12px; }

/* ============================================================
   КНОПКИ
   ============================================================ */
.btn-primary, .btn-secondary, .btn-danger, .btn-ghost, .btn-block {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  transition: transform 0.1s, background 0.15s;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn-block { width: 100%; display: block; }
button:active { transform: scale(0.97); }

.btn-with-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.btn-with-icon svg { width: 18px; height: 18px; flex-shrink: 0; }

.quick-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

/* ============================================================
   ФОРМЫ
   ============================================================ */
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-weight: 500;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-input);
  color: var(--text);
  font-size: 16px;
  -webkit-appearance: none;
  appearance: none;
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}
.search-input {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  color: var(--text);
  font-size: 16px;
  flex: 1;
  min-width: 120px;
  -webkit-appearance: none;
}

/* ============================================================
   МОДАЛКА
   ============================================================ */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.15s;
}
.modal.hidden { display: none; }
.modal-content {
  background: var(--bg-card);
  border-radius: 18px 18px 0 0;
  width: 100%;
  max-width: 720px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.25s;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.modal-header h2 { font-size: 17px; margin: 0; }
.modal-close {
  background: var(--bg-input);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 16px;
  color: var(--text);
}
.modal-body {
  padding: 18px 20px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0));
  overflow-x: auto;
  scrollbar-width: none;
}
.modal-footer::-webkit-scrollbar { display: none; }
.modal-footer > button { flex: 0 0 auto; }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-header);
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 3000;
  box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  animation: fadeIn 0.2s;
  max-width: 90vw;
  text-align: center;
}
.toast.hidden { display: none; }

/* ============================================================
   БЕЙДЖИ И ЧИПЫ
   ============================================================ */
.badge {
  display: inline-block;
  background: var(--bg-input);
  color: var(--text-muted);
  padding: 3px 9px;
  border-radius: 10px;
  font-size: 11px;
  margin-right: 5px;
  margin-bottom: 4px;
}
.badge-accent { background: var(--accent); color: #fff; }

.chip {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}
.chips-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: none;
  margin-bottom: 12px;
}
.chips-row::-webkit-scrollbar { display: none; }

/* ============================================================
   ТАБЛИЦЫ
   ============================================================ */
table.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 13px;
}
table.data-table th {
  background: var(--bg-input);
  padding: 8px 6px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-muted);
}
table.data-table td {
  padding: 8px 6px;
  border-bottom: 1px solid var(--border);
}

/* ============================================================
   ПЛИТКА УПРАЖНЕНИЙ
   ============================================================ */
.tiles-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.tile {
  background: var(--bg-card);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  position: relative;
  cursor: pointer;
}
.tile-img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  display: block;
  background: var(--bg-input);
}
.tile-img-placeholder {
  width: 100%;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-input);
  font-size: 36px;
}
.tile-body { padding: 10px 12px; }
.tile-title {
  font-weight: 600;
  font-size: 13px;
  line-height: 1.3;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.tile-sub {
  font-size: 11px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tile-corner {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.tile-cat {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0,0,0,0.5);
  border-radius: 12px;
  padding: 2px 8px;
  font-size: 11px;
  color: #fff;
}
.tile-actions {
  position: absolute;
  bottom: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
}
.tile-actions button {
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 13px;
}

/* ============================================================
   АДАПТИВ
   ============================================================ */
@media (max-width: 400px) {
  .tiles-grid { gap: 8px; }
  .tile-img, .tile-img-placeholder { height: 120px; }
  .dash-big-number { font-size: 22px; }
}

/* ============================================================
   ПЕЧАТЬ
   ============================================================ */
@media print {
  .app-header, .bottom-nav, .modal-footer, .quick-actions { display: none !important; }
  body { padding: 0; background: #fff; }
}
</style>
</head>
<body data-tab="dashboard">

<!-- ============ ШАПКА ============ -->
<header class="app-header">
  <div class="logo">🏋️ Тренер</div>
  <div class="header-spacer"></div>
  <button class="icon-btn-header" id="themeToggle" title="Сменить тему">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </svg>
  </button>
  <button class="icon-btn-header" id="settingsBtn" title="Настройки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>
</header>

<!-- ============ ОСНОВНОЙ КОНТЕНТ ============ -->
<main class="app-main">

  <!-- ГЛАВНАЯ -->
  <section id="tab-dashboard" class="tab-content active">
    <div class="dash-date" id="dashDate">📅 Загрузка...</div>
    <div id="dashContent"></div>
  </section>

  <!-- КЛИЕНТЫ -->
  <section id="tab-clients" class="tab-content">
    <div class="tab-header">
      <h1>Клиенты</h1>
      <button class="btn-primary" id="addClientBtn">+ Добавить</button>
    </div>
    <div style="margin-bottom:14px;display:flex;flex-direction:column;gap:10px;">
      <input type="search" id="clientSearch" placeholder="🔍 Поиск по имени, телефону, цели..." class="search-input" style="width:100%;">
      <div class="chips-row" id="clientStatusFilters">
        <button class="chip active" data-status="all">Все</button>

/* ==================== УТИЛИТЫ ==================== */
const Utils = {
  uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  },

  escape(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  },

  formatDate(iso) {
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    return `${dd}.${mm}.${yyyy}`;
  },

  todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },

  plural(n, one, few, many) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
    return many;
  },

  catIcon(catId) {
    const cat = CATEGORY_MAP[catId];
    return cat ? cat.icon : '';
  }
};

    clearTimeout(this.timer);

};

/* ==================== ЗАГРУЗКА ФОТО (IMGBB) ==================== */
const PhotoUploader = {
  async compress(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = CONFIG.PHOTO_MAX_WIDTH;
          let w = img.width;
          let h = img.height;
          if (w > maxW) {
            h = Math.round(h * (maxW / w));
            w = maxW;
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(
            (blob) => blob ? resolve(blob) : reject(new Error('Ошибка сжатия')),
            'image/jpeg',
            CONFIG.PHOTO_QUALITY
          );
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  },

  async upload(blob) {
    const formData = new FormData();
    formData.append('image', blob);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${CONFIG.IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (!json.success) throw new Error(json.error?.message || 'Ошибка ImgBB');
    return json.data.url;
  },

  async processFile(file) {
    if (!file) return null;
    if (!file.type.startsWith('image/')) throw new Error('Файл не является изображением');
    const blob = await this.compress(file);
    return await this.upload(blob);
  }
};

/* ==================== ОБРАБОТЧИК ФОТО В ФОРМАХ ==================== */
const PhotoHandler = {
  triggerCamera() {
    const input = document.getElementById('photoCameraInput');
    if (input) input.click();
  },

  triggerGallery() {
    const input = document.getElementById('photoGalleryInput');
    if (input) input.click();
  },

  async onFileSelected(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('photoUploadStatus');
    const urlInput = document.getElementById('exPhoto');

    if (statusEl) statusEl.innerHTML = '<span style="color:var(--accent);">⏳ Сжатие и загрузка...</span>';

    try {
      const url = await PhotoUploader.processFile(file);
      if (urlInput) urlInput.value = url;
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--success);">✅ Фото загружено</span>';

      const preview = document.getElementById('exPhotoPreview');
      if (preview) {
        preview.innerHTML = `<img src="${url}" style="max-width:100%;max-height:200px;border-radius:10px;margin-top:8px;display:block;">`;
      }

      Toast.show('✅ Фото загружено');
    } catch (err) {
      console.error(err);
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--danger);">❌ ${Utils.escape(err.message)}</span>`;
      Toast.show('❌ Ошибка загрузки фото');
    } finally {
      event.target.value = '';
    }
  },

  clear() {
    const urlInput = document.getElementById('exPhoto');
    const preview = document.getElementById('exPhotoPreview');
    const statusEl = document.getElementById('photoUploadStatus');
    if (urlInput) urlInput.value = '';
    if (preview) preview.innerHTML = '';
    if (statusEl) statusEl.innerHTML = '';
    Toast.show('🗑 Фото убрано');
  }
};

const Clients = {
  searchQuery: '',
  statusFilter: 'all',

  render() {
    const container = document.getElementById('clientsList');
    if (!container) return;

    let list = [...State.data.clients];

    if (this.statusFilter !== 'all') {
      list = list.filter(c => (c.status || 'active') === this.statusFilter);
    }

    const q = this.searchQuery.trim().toLowerCase();
    if (q) {
      list = list.filter(c =>
        (c.name || '').toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q) ||
        (c.goal || '').toLowerCase().includes(q)
      );
    }

    list.sort((a, b) => {
      const aActive = (a.status || 'active') === 'active';
      const bActive = (b.status || 'active') === 'active';
      if (aActive !== bActive) return bActive - aActive;
      return (a.name || '').localeCompare(b.name || '');
    });

    if (!list.length) {
      container.innerHTML = `
        <div class="empty-state">
          <span class="emoji">👥</span>

    container.innerHTML = list.map(c => {
      const programCount = (c.days || []).reduce((sum, d) => sum + d.blocks.length, 0);
      const status = c.status || 'active';

      return `

    const status = c.status || 'active';

  bindSearch() {
    const search = document.getElementById('clientSearch');

    if (search) {

        this.searchQuery = e.target.value;
        this.render();
      });
    }

    filters.forEach(chip => {
      chip.addEventListener('click', () => {
        filters.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        this.statusFilter = chip.dataset.status;
        this.render();
      });
    });
  }
};

          <label>Техника (каждый пункт с новой строки)</label>
          <textarea id="exTechnique">${Utils.escape((ex.technique || []).join('\n'))}</textarea>
        </div>
        <div class="form-group">
          <label>Ошибки (каждая с новой строки)</label>
          <textarea id="exMistakes">${Utils.escape((ex.mistakes || []).join('\n'))}</textarea>
        </div>
        <div class="form-group">
          <label>Совет</label>
          <input id="exTip" value="${Utils.escape(ex.tip || '')}" placeholder="Полезный совет">
        </div>
      `,
      footer: `
        ${isEdit ? `<button class="btn-danger" onclick="Library.delete('${id}')">🗑</button>` : ''}
        <button class="btn-secondary" onclick="Modal.close()">Отмена</button>
        <button class="btn-primary" onclick="Library.save('${id || ''}')">Сохранить</button>
      `
    });
  },

  save(id) {
    const name = document.getElementById('exName').value.trim();
    if (!name) { Toast.show('⚠️ Введите название'); return; }

    const data = {
      name,
      category: document.getElementById('exCategory').value,
      muscles: document.getElementById('exMuscles').value.trim(),
      photo: document.getElementById('exPhoto').value.trim(),
      schema: document.getElementById('exSchema').value,
      technique: document.getElementById('exTechnique').value.split('\n').map(s => s.trim()).filter(Boolean),
      mistakes: document.getElementById('exMistakes').value.split('\n').map(s => s.trim()).filter(Boolean),
      tip: document.getElementById('exTip').value.trim()
    };

    if (id) {
      const idx = State.data.exercises.findIndex(e => e.id === id);
      if (idx !== -1) State.data.exercises[idx] = { ...State.data.exercises[idx], ...data };
      Toast.show('✅ Обновлено');
    } else {
      State.data.exercises.push({ id: Utils.uid(), ...data, favorite: false });
      Toast.show('✅ Добавлено');
    }

    State.save();
    Modal.close();
    this.render();
    App.updateStats();
  },

  delete(id) {
    Modal.confirm('Удалить это упражнение?', () => {
      State.data.exercises = State.data.exercises.filter(e => e.id !== id);
      State.save();
      Modal.close();
      this.render();
      App.updateStats();
      Toast.show('🗑 Удалено');
    });
  },

  bindSearch() {
    const search = document.getElementById('librarySearch');
    const viewToggle = document.querySelectorAll('#viewToggle .chip');

    if (search) {
      search.addEventListener('input', (e) => {
        this.searchQuery = e.target.value;
        this.render();
      });
    }

    viewToggle.forEach(chip => {
      chip.addEventListener('click', () => this.setView(chip.dataset.view));
    });
  }
};

const Programs = {
  currentDay: 0,

  openEditor(clientId) {

    if (!c.days || !Array.isArray(c.days)) {

  switchDay(clientId, idx) {

  addDay(clientId) {

      title: 'Новый день',

          <label style="font-size:11px;">🅰️ Первое</label>
          <select onchange="Programs.updateBlock('${clientId}', ${idx}, 'exA', this.value)">
            <option value="">— выберите —</option>
            ${exercises.map(e => `<option value="${e.id}" ${e.id === block.exA ? 'selected' : ''}>${Utils.escape(e.name)}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" style="margin-bottom:10px;">
          <label style="font-size:11px;">🅱️ Второе</label>
          <select onchange="Programs.updateBlock('${clientId}', ${idx}, 'exB', this.value)">
            <option value="">— выберите —</option>
            ${exercises.map(e => `<option value="${e.id}" ${e.id === block.exB ? 'selected' : ''}>${Utils.escape(e.name)}</option>`).join('')}
          </select>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <div class="form-group" style="margin:0;">
            <label style="font-size:11px;">Подходы</label>
            <input type="number" min="1" value="${block.sets || 3}" onchange="Programs.updateBlock('${clientId}', ${idx}, 'sets', this.value)">
          </div>
          <div class="form-group" style="margin:0;">
            <label style="font-size:11px;">Повторы</label>
            <input value="${Utils.escape(block.reps || '12-15')}" onchange="Programs.updateBlock('${clientId}', ${idx}, 'reps', this.value)">
          </div>
          <div class="form-group" style="margin:0;">
            <label style="font-size:11px;">Отдых (сек)</label>
            <input type="number" min="0" value="${block.rest || 90}" onchange="Programs.updateBlock('${clientId}', ${idx}, 'rest', this.value)">
          </div>
        </div>

  addBlock(clientId, type) {
    const c = State.data.clients.find(x => x.id === clientId);
    if (!c) return;
    const day = c.days[this.currentDay];
    const newBlock = type === 'single'
      ? { type: 'single', exerciseId: '', sets: 3, reps: '12-15', rest: 90 }
      : { type: 'superset', exA: '', exB: '', sets: 3, reps: '12-15', rest: 90 };
    day.blocks.push(newBlock);
    State.save();
    this.renderEditor(clientId);
  },

  updateBlock(clientId, idx, field, value) {
    const c = State.data.clients.find(x => x.id === clientId);
    if (!c) return;
    const day = c.days[this.currentDay];
    if (!day.blocks[idx]) return;
    day.blocks[idx][field] = (field === 'sets' || field === 'rest') ? Number(value) : value;
    State.save();
  },

  removeBlock(clientId, idx) {
    const c = State.data.clients.find(x => x.id === clientId);
    if (!c) return;
    c.days[this.currentDay].blocks.splice(idx, 1);
    State.save();
    this.renderEditor(clientId);
  },

  save(clientId) {
    State.save();
    Modal.close();
    Toast.show('✅ Программа сохранена');
    Clients.openDetail(clientId);
  },

  blockPreview(block, idx) {

/* ==================== ТРЕНИРОВКА ==================== */
const Workout = {
  active: null,
  currentBlock: 0,
  currentSet: 0,
  currentPhase: 'A',
  restTimer: null,
  restSeconds: 0,
  restCallback: null,

  start(clientId) {
    const c = State.data.clients.find(x => x.id === clientId);
    if (!c) { Toast.show('⚠️ Клиент не найден'); return; }

    if (!c.days || !Array.isArray(c.days)) {
      c.days = [{ name: 'Тренировка 1', blocks: c.program || [] }];
    }

    const validDays = c.days.filter(d => d.blocks && d.blocks.length);
    if (!validDays.length) {
      Toast.show('⚠️ Сначала добавьте упражнения в программу');
      return;
    }

    if (validDays.length === 1) {
      return this.startDay(clientId, c.days.indexOf(validDays[0]));
    }

    const daysButtons = validDays.map(d => {
      const idx = c.days.indexOf(d);
      return `
        <button class="btn-secondary btn-block" style="margin-bottom:10px;text-align:left;padding:14px 16px;"
                onclick="Modal.close(); Workout.startDay('${clientId}', ${idx})">
          <div style="font-weight:600;">${Utils.escape(d.name)}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${d.blocks.length} ${Utils.plural(d.blocks.length, 'упражнение', 'упражнения', 'упражнений')}</div>
        </button>
      `;
    }).join('');

    Modal.open({
      title: 'Выберите тренировку',
      body: `<p style="font-size:14px;margin-bottom:14px;">Какой день выполняем?</p>${daysButtons}`,
      footer: `<button class="btn-secondary btn-block" onclick="Modal.close()">Отмена</button>`
    });
  },

  startDay(clientId, dayIdx) {
    const c = State.data.clients.find(x => x.id === clientId);
    if (!c) return;
    const day = c.days[dayIdx];
    if (!day || !day.blocks.length) { Toast.show('⚠️ В этом дне нет упражнений'); return; }

    const steps = [];
    day.blocks.forEach(block => {
      if (block.type === 'single') {
        if (!block.exerciseId) return;
        const ex = State.data.exercises.find(e => e.id === block.exerciseId);
        if (!ex) return;
        steps.push({ kind: 'single', block, ex, sets: block.sets || 3, reps: block.reps || '12-15', rest: block.rest || 90 });
      } else {
        const a = State.data.exercises.find(e => e.id === block.exA);
        const b = State.data.exercises.find(e => e.id === block.exB);
        if (!a || !b) return;
        steps.push({ kind: 'superset', block, exA: a, exB: b, sets: block.sets || 3, reps: block.reps || '12-15', rest: block.rest || 90 });
      }
    });

    if (!steps.length) { Toast.show('⚠️ Нет валидных упражнений'); return; }

    const results = steps.map(step => ({
      name: step.kind === 'single' ? step.ex.name : `${step.exA.name} + ${step.exB.name}`,
      kind: step.kind,
      sets: [],
      repsTarget: step.reps,
      restTarget: step.rest,
      totalSets: step.sets
    }));

    this.active = {
      clientId,
      clientName: c.name,
      dayName: day.name,
      steps,
      results,
      startedAt: new Date().toISOString()
    };
    this.currentBlock = 0;
    this.currentSet = 0;
    this.currentPhase = 'A';
    this.render();
  },

  render() {
    if (!this.active) return;
    const steps = this.active.steps;
    const step = steps[this.currentBlock];
    const setNum = this.currentSet + 1;
    const totalSets = step.sets;

    let currentExName = step.kind === 'single'
      ? step.ex.name
      : (this.currentPhase === 'A' ? `🅰️ ${step.exA.name}` : `🅱️ ${step.exB.name}`);

    const progressPct = Math.round((this.currentBlock / steps.length) * 100);

    Modal.open({
      title: `🏋️ ${this.active.clientName} — ${this.active.dayName}`,
      body: `
        <div style="margin-bottom:14px;">
          <div style="background:var(--border);height:6px;border-radius:3px;overflow:hidden;">
            <div style="background:var(--accent);height:100%;width:${progressPct}%;transition:width 0.3s;"></div>
          </div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:6px;text-align:center;">
            Упражнение ${this.currentBlock + 1} из ${steps.length}
          </div>
        </div>
        <h2 style="font-size:18px;margin-bottom:6px;">${Utils.escape(currentExName)}</h2>
        ${step.kind === 'superset' ? '<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">Суперсет — А и Б подряд</div>' : ''}
        <div style="background:var(--bg-input);border-radius:12px;padding:14px;margin-top:14px;">
          <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">
            Подход ${setNum} из ${totalSets} • цель: ${step.reps}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div class="form-group" style="margin:0;">
              <label style="font-size:12px;">Вес (кг)</label>
              <input type="number" inputmode="decimal" step="0.5" min="0" id="inpWeight" placeholder="0" style="font-size:16px;">
            </div>
            <div class="form-group" style="margin:0;">
              <label style="font-size:12px;">Повторы</label>
              <input type="number" inputmode="numeric" min="0" id="inpReps" placeholder="12" style="font-size:16px;">
            </div>
          </div>
        </div>
        <div id="restZone"></div>
      `,
      footer: `
        <button class="btn-danger" onclick="Workout.confirmStop()">Стоп</button>
        <button class="btn-primary" style="flex:2;" onclick="Workout.completeSet()">
          ${this.currentPhase === 'A' && step.kind === 'superset' ? '➡️ Далее к Б' : '✅ Выполнено'}
        </button>
      `
    });

    setTimeout(() => {
      const w = document.getElementById('inpWeight');
      if (w) w.focus();
    }, 200);
  },

  completeSet() {
    if (!this.active) return;
    const step = this.active.steps[this.currentBlock];
    const result = this.active.results[this.currentBlock];
    const wEl = document.getElementById('inpWeight');
    const rEl = document.getElementById('inpReps');

    const weight = wEl && wEl.value ? parseFloat(wEl.value) : null;
    const reps = rEl && rEl.value ? parseInt(rEl.value) : null;

    result.sets.push({
      weight,
      reps,
      phase: step.kind === 'superset' ? this.currentPhase : null,
      ts: new Date().toISOString()
    });

    if (step.kind === 'single') {
      if (this.currentSet + 1 < step.sets) {
        this.currentSet++;
        this.startRest(step.rest);
      } else {
        this.nextExercise();
      }
    } else {
      if (this.currentPhase === 'A') {
        this.currentPhase = 'B';
        Toast.show('➡️ Теперь Б');
        this.render();
      } else {
        if (this.currentSet + 1 < step.sets) {
          this.currentSet++;
          this.currentPhase = 'A';
          this.startRest(step.rest);
        } else {
          this.nextExercise();
        }
      }
    }
  },

  nextExercise() {
    if (this.currentBlock + 1 < this.active.steps.length) {
      const step = this.active.steps[this.currentBlock];
      this.startRest(step.rest, () => {
        this.currentBlock++;
        this.currentSet = 0;
        this.currentPhase = 'A';
        this.render();
      });
    } else {
      this.finish();
    }
  },

  startRest(seconds, callback) {
    this.restSeconds = seconds;
    this.restCallback = callback || null;

    const restZone = document.getElementById('restZone');
    if (!restZone) return;

    const renderTimer = () => {
      if (!restZone) return;
      restZone.innerHTML = `
        <div style="text-align:center;margin-top:20px;padding:20px;background:var(--success-bg);border-radius:12px;">
          <div style="font-size:13px;color:var(--success);margin-bottom:6px;">⏱ Отдых</div>
          <div style="font-size:36px;font-weight:700;color:var(--success);" id="restTime">${this.restSeconds}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">секунд</div>
        </div>
      `;
    };

    renderTimer();

    const footer = document.getElementById('modalFooter');
    if (footer) {
      footer.innerHTML = `
        <button class="btn-danger" onclick="Workout.confirmStop()">Стоп</button>
        <button class="btn-primary" style="flex:2;" onclick="Workout.skipRest()">⏭ Пропустить</button>
      `;
    }

    clearInterval(this.restTimer);
    this.restTimer = setInterval(() => {
      this.restSeconds--;
      const el = document.getElementById('restTime');
      if (el) el.textContent = this.restSeconds;
      if (this.restSeconds <= 0) {
        clearInterval(this.restTimer);
        this.restTimer = null;
        this.endRest();
      } else if (this.restSeconds <= 3) {
        this.beep();
      }
    }, 1000);
  },

  skipRest() {
    clearInterval(this.restTimer);
    this.restTimer = null;
    this.endRest();
  },

  endRest() {
    this.beep();
    if (this.restCallback) {
      const cb = this.restCallback;
      this.restCallback = null;
      cb();
    } else {
      this.render();
    }
  },

  beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  },

  confirmStop() {
    Modal.confirm('Завершить тренировку? Результаты будут сохранены.', () => this.finish(true));
  },

  finish(early = false) {
    if (this.restTimer) { clearInterval(this.restTimer); this.restTimer = null; }

    const filled = this.active.results.filter(r => r.sets.length > 0);
    if (!filled.length) {
      Toast.show('Нет данных для сохранения');
      this.active = null;
      Modal.close();
      return;
    }

    const workout = {
      id: Utils.uid(),
      clientId: this.active.clientId,
      clientName: this.active.clientName,
      dayName: this.active.dayName,
      date: new Date().toISOString(),
      startedAt: this.active.startedAt,
      results: filled,
      early
    };

    State.data.workouts.unshift(workout);

    // Отмечаем запись в расписании как проведённую, если есть совпадение
    const todayISO = Utils.todayISO();
    (State.data.schedule || []).forEach(rec => {
      if (rec.clientId === workout.clientId && rec.date === todayISO && !rec.done) {
        rec.done = true;
        rec.status = 'done';
      }
    });

    State.save();
    this.active = null;
    Modal.close();
    Toast.show(early ? '✅ Сохранено (досрочно)' : '🎉 Тренировка завершена!');
    App.updateStats();
    History.render();
    if (typeof Dashboard !== 'undefined') Dashboard.render();
  }
};

const History = {

      container.innerHTML = `<div class="empty-state"><span class="emoji">📈</span>Пока нет завершённых тренировок.</div>`;
      return;
    }

    container.innerHTML = list.map(w => {
      const totalSets = w.results.reduce((sum, r) => sum + r.sets.length, 0);
      const totalVolume = w.results.reduce((sum, r) =>
        sum + r.sets.reduce((s, set) => s + (set.weight || 0) * (set.reps || 0), 0), 0);

      return `
        <div class="list-item" onclick="History.openDetail('${w.id}')">
          <div class="list-item-thumb" style="display:flex;align-items:center;justify-content:center;font-size:22px;">📋</div>

            <div class="list-item-title">${Utils.escape(w.clientName)}</div>

              ${Utils.formatDate(w.date)}${w.dayName ? ' • ' + Utils.escape(w.dayName) : ''} • ${w.results.length} упр. • ${totalSets} подх.${totalVolume ? ' • ' + Math.round(totalVolume) + ' кг' : ''}

      sum + r.sets.reduce((s, set) => s + (set.weight || 0) * (set.reps || 0), 0), 0);

          <table class="data-table"><tr><th>#</th><th>Вес</th><th>Повторы</th></tr>${setsRows}</table>

    Modal.open({

      body: `
        <div class="cards-grid" style="grid-template-columns:1fr 1fr;">

        </div>

        <button class="btn-primary" onclick="Exporter.exportWorkout('${w.id}')">📄 В Word</button>
      `
    });

  delete(id) {
    Modal.confirm('Удалить запись тренировки?', () => {
      State.data.workouts = State.data.workouts.filter(w => w.id !== id);

      Modal.close();
      this.render();
      App.updateStats();
      if (typeof Dashboard !== 'undefined') Dashboard.render();
