};

/* ==================== РЕДАКТОР ТРЕНИРОВКИ ==================== */
const WorkoutEditor = {
  open(workoutId) {
    const w = State.data.workouts.find(x => x.id === workoutId);
    if (!w) return;

    Modal.open({
      title: 'Редактирование',
      body: `
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">
          ${Utils.escape(w.clientName)} • ${Utils.formatDate(w.date)}
        </p>
        ${w.results.map((r, i) => this.resultEditor(r, i, workoutId)).join('')}
      `,
      footer: `
        <button class="btn-secondary" onclick="Modal.close(); History.openDetail('${workoutId}')">Отмена</button>
        <button class="btn-primary" onclick="WorkoutEditor.save('${workoutId}')">💾 Сохранить</button>
      `
    });
  },

  resultEditor(result, idx, workoutId) {
    const setsRows = result.sets.map((s, i) => `
      <tr>
        <td style="text-align:center;font-size:12px;">${i + 1}${s.phase ? ' (' + s.phase + ')' : ''}</td>
        <td><input type="number" step="0.5" min="0" value="${s.weight != null ? s.weight : ''}" style="width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;" onchange="WorkoutEditor.updateSet('${workoutId}', ${idx}, ${i}, 'weight', this.value)"></td>
        <td><input type="number" min="0" value="${s.reps != null ? s.reps : ''}" style="width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;" onchange="WorkoutEditor.updateSet('${workoutId}', ${idx}, ${i}, 'reps', this.value)"></td>
        <td style="text-align:center;"><button class="icon-btn" onclick="WorkoutEditor.removeSet('${workoutId}', ${idx}, ${i})">🗑</button></td>
      </tr>
    `).join('');

    return `
      <div style="background:var(--bg-input);border-radius:10px;padding:12px;margin-bottom:10px;">
        <div style="font-weight:600;font-size:14px;margin-bottom:8px;">${idx + 1}. ${Utils.escape(result.name)}</div>
        <table class="data-table" style="font-size:12px;">
          <tr><th style="width:50px;text-align:center;">#</th><th>Вес (кг)</th><th>Повторы</th><th style="width:40px;"></th></tr>
          ${setsRows}
        </table>
        <button class="btn-ghost" style="margin-top:8px;font-size:12px;padding:6px 10px;" onclick="WorkoutEditor.addSet('${workoutId}', ${idx})">+ Подход</button>
      </div>
    `;
  },

  updateSet(workoutId, resultIdx, setIdx, field, value) {
    const w = State.data.workouts.find(x => x.id === workoutId);
    if (!w) return;
    const set = w.results[resultIdx].sets[setIdx];
    if (!set) return;
    set[field] = value === '' ? null : (field === 'weight' ? parseFloat(value) : parseInt(value));
    State.save();
  },

  addSet(workoutId, resultIdx) {
    const w = State.data.workouts.find(x => x.id === workoutId);
    if (!w) return;
    w.results[resultIdx].sets.push({ weight: null, reps: null, phase: null, ts: new Date().toISOString() });
    State.save();
    this.open(workoutId);
  },

  removeSet(workoutId, resultIdx, setIdx) {
    const w = State.data.workouts.find(x => x.id === workoutId);
    if (!w) return;
    if (w.results[resultIdx].sets.length <= 1) { Toast.show('⚠️ Нельзя удалить последний подход'); return; }
    Modal.confirm('Удалить подход?', () => {
      w.results[resultIdx].sets.splice(setIdx, 1);
      State.save();
      Modal.close();
      this.open(workoutId);
    });
  },

  save(workoutId) {
    State.save();
    Modal.close();
    Toast.show('✅ Сохранено');
    History.openDetail(workoutId);
  }
};

/* ==================== ПРОГРЕСС ==================== */
const Progress = {
  currentClientId: null,

  open(clientId) {
    const c = State.data.clients.find(x => x.id === clientId);
    if (!c) return;
    this.currentClientId = clientId;

    const workouts = State.data.workouts
      .filter(w => w.clientId === clientId)
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    if (!workouts.length) {
      Modal.open({
        title: `📈 ${c.name}`,
        body: `<div class="empty-state"><span class="emoji">📈</span>Пока нет тренировок</div>`,
        footer: `<button class="btn-secondary btn-block" onclick="Modal.close()">Закрыть</button>`
      });
      return;
    }

    const exerciseMap = {};
    workouts.forEach(w => {
      w.results.forEach(r => {
        if (!exerciseMap[r.name]) exerciseMap[r.name] = [];
        const maxW = Math.max(...r.sets.map(s => s.weight || 0));
        exerciseMap[r.name].push({ date: w.date, maxWeight: maxW, sets: r.sets });
      });
    });

    const names = Object.keys(exerciseMap);
    const totalVolume = workouts.reduce((sum, w) =>
      sum + w.results.reduce((s, r) => s + r.sets.reduce((ss, set) => ss + (set.weight || 0) * (set.reps || 0), 0), 0), 0);

    Modal.open({
      title: `📈 ${c.name}`,
      body: `
        <div class="cards-grid" style="margin-bottom:16px;">
          <div class="card"><div class="card-icon">🏋️</div><div class="card-value">${workouts.length}</div><div class="card-label">Тренировок</div></div>
          <div class="card"><div class="card-icon">📊</div><div class="card-value">${Math.round(totalVolume / 1000)}</div><div class="card-label">Тонн</div></div>
          <div class="card"><div class="card-icon">📅</div><div class="card-value">${Utils.formatDate(workouts[0].date).slice(0, 5)}</div><div class="card-label">Начало</div></div>
        </div>
        <h3 style="margin-bottom:10px;">🏆 Рекорды</h3>
        <div style="margin-bottom:20px;">${names.map(n => this.recordCard(n, exerciseMap[n])).join('')}</div>
        <h3 style="margin-bottom:10px;">📈 Прогресс</h3>
        <div class="form-group"><select id="progressExerciseSelect" onchange="Progress.showChart(this.value)">${names.map(n => `<option value="${Utils.escape(n)}">${Utils.escape(n)}</option>`).join('')}</select></div>
        <div id="progressChartContainer"></div>
      `,
      footer: `<button class="btn-secondary btn-block" onclick="Modal.close()">Закрыть</button>`
    });

    setTimeout(() => this.showChart(names[0]), 100);
  },

  recordCard(name, entries) {
    let bestWeight = 0, bestReps = 0, best1RM = 0;
    entries.forEach(e => {
      e.sets.forEach(set => {
        if (!set.weight || !set.reps) return;
        const oneRM = set.weight * (1 + set.reps / 30);
        if (oneRM > best1RM) { best1RM = oneRM; bestWeight = set.weight; bestReps = set.reps; }
      });
    });
    const first = entries[0], last = entries[entries.length - 1];
    const progress = first.maxWeight && last.maxWeight ? Math.round(((last.maxWeight - first.maxWeight) / first.maxWeight) * 100) : 0;
    const icon = progress > 0 ? '📈' : progress < 0 ? '📉' : '➡️';
    const color = progress > 0 ? 'var(--success)' : progress < 0 ? 'var(--danger)' : 'var(--text-muted)';
    const text = progress > 0 ? `+${progress}%` : progress < 0 ? `${progress}%` : '0%';

    return `
      <div style="background:var(--bg-input);border-radius:10px;padding:10px 14px;margin-bottom:8px;">
        <div style="font-weight:600;font-size:13px;margin-bottom:6px;">${Utils.escape(name)}</div>
        <div style="display:flex;justify-content:space-between;font-size:12px;align-items:center;">
          <span style="color:var(--text-muted);">🏆 ${bestWeight} кг × ${bestReps} • 1ПМ ≈ ${Math.round(best1RM)}</span>
          <span style="color:${color};font-weight:600;">${icon} ${text}</span>
        </div>
      </div>
    `;
  },

  showChart(name) {
    const container = document.getElementById('progressChartContainer');
    if (!container) return;
    const workouts = State.data.workouts.filter(w => w.clientId === this.currentClientId).sort((a, b) => new Date(a.date) - new Date(b.date));
    const points = [];
    workouts.forEach(w => {
      w.results.forEach(r => {
        if (r.name !== name) return;
        const maxW = Math.max(...r.sets.map(s => s.weight || 0));
        if (maxW > 0) points.push({ date: w.date, weight: maxW });
      });
    });

    if (points.length < 2) {
      container.innerHTML = `<div style="background:var(--bg-input);border-radius:10px;padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">Нужно минимум 2 тренировки для графика</div>`;
      return;
    }

    const width = container.clientWidth || 300;
    const height = 160;
    const pad = { top: 20, right: 20, bottom: 30, left: 40 };
    const cW = width - pad.left - pad.right;
    const cH = height - pad.top - pad.bottom;
    const weights = points.map(p => p.weight);
    const minW = Math.min(...weights) * 0.95;
    const maxW = Math.max(...weights) * 1.05;
    const xStep = cW / Math.max(points.length - 1, 1);
    const coords = points.map((p, i) => ({ x: pad.left + i * xStep, y: pad.top + cH - ((p.weight - minW) / (maxW - minW)) * cH, ...p }));
    const pathLine = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x} ${c.y}`).join(' ');
    const pathArea = `${pathLine} L ${coords[coords.length - 1].x} ${pad.top + cH} L ${coords[0].x} ${pad.top + cH} Z`;
    const grid = [0, 0.5, 1].map(t => {
      const y = pad.top + cH * (1 - t);
      const v = Math.round(minW + (maxW - minW) * t);
      return `<line x1="${pad.left}" y1="${y}" x2="${pad.left + cW}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/><text x="${pad.left - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="var(--text-muted)">${v}</text>`;
    }).join('');
    const circles = coords.map(c => `<circle cx="${c.x}" cy="${c.y}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/><text x="${c.x}" y="${c.y - 8}" text-anchor="middle" font-size="9" fill="var(--text)" font-weight="600">${c.weight}</text>`).join('');
    const dates = coords.map((c, i) => {
      if (i % Math.ceil(coords.length / 4) !== 0 && i !== coords.length - 1) return '';
      return `<text x="${c.x}" y="${height - 10}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${Utils.formatDate(c.date).slice(0, 5)}</text>`;
    }).join('');

    container.innerHTML = `<div style="background:var(--bg-input);border-radius:10px;padding:12px;"><svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}">${grid}<path d="${pathArea}" fill="var(--accent)" opacity="0.1"/><path d="${pathLine}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${circles}${dates}</svg></div>`;
  },

  showOverall() {
    const workouts = State.data.workouts;
    if (!workouts.length) {
      Modal.open({ title: '📊 Общий прогресс', body: `<div class="empty-state"><span class="emoji">📊</span>Пока нет тренировок</div>`, footer: `<button class="btn-secondary btn-block" onclick="Modal.close()">Закрыть</button>` });
      return;
    }
    const monthAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
    const recent = workouts.filter(w => new Date(w.date).getTime() > monthAgo);
    const clientCount = {};
    workouts.forEach(w => { clientCount[w.clientName] = (clientCount[w.clientName] || 0) + 1; });
    const topClients = Object.entries(clientCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const monthVolume = recent.reduce((sum, w) => sum + w.results.reduce((s, r) => s + r.sets.reduce((ss, set) => ss + (set.weight || 0) * (set.reps || 0), 0), 0), 0);

    Modal.open({
      title: '📊 Общий прогресс',
      body: `
        <div class="cards-grid" style="grid-template-columns:1fr 1fr;margin-bottom:16px;">
          <div class="card"><div class="card-icon">🏋️</div><div class="card-value">${recent.length}</div><div class="card-label">За 30 дней</div></div>
          <div class="card"><div class="card-icon">📊</div><div class="card-value">${Math.round(monthVolume / 1000)}</div><div class="card-label">Тонн</div></div>
        </div>
        <h3 style="margin-bottom:10px;">🏆 Топ клиентов</h3>
        ${topClients.map(([name, count]) => `<div style="background:var(--bg-input);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;font-size:13px;"><span>${Utils.escape(name)}</span><span style="color:var(--accent);font-weight:600;">${count} трен.</span></div>`).join('')}
      `,
      footer: `<button class="btn-secondary btn-block" onclick="Modal.close()">Закрыть</button>`
    });
  }
};

/* ==================== РАСПИСАНИЕ ==================== */
const Schedule = {
  viewMode: 'day',
  currentDate: null,
  currentWeekStart: null,

  DEFAULT_HOURS: {
    1: { start: 9, end: 20, off: false },
    2: { start: 9, end: 20, off: false },
    3: { start: 9, end: 20, off: false },
    4: { start: 9, end: 20, off: false },
    5: { start: 9, end: 20, off: false },
    6: { start: 10, end: 15, off: false },
    0: { start: 9, end: 20, off: true }
  },

  init() {
    if (!State.data.settings.workHours) {
      State.data.settings.workHours = JSON.parse(JSON.stringify(this.DEFAULT_HOURS));
      State.save();
    }
    this.currentDate = Utils.todayISO();
    this.currentWeekStart = this.getMonday(new Date());
    this.render();
  },

  getHoursForDate(isoDate) {
    const d = new Date(isoDate);
    const dow = d.getDay();
    const wh = State.data.settings.workHours || this.DEFAULT_HOURS;
    return wh[dow] || this.DEFAULT_HOURS[dow] || { start: 9, end: 20, off: false };
  },

  getMonday(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    d.setDate(diff);
    d.setHours(0, 0, 0, 0);
    return d;
  },

  toISODate(date) {
    const d = new Date(date);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },

  recordsForDate(isoDate) {
    return (State.data.schedule || []).filter(s => s.date === isoDate).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  },

  statusColor(record) {
    if (record.status === 'cancelled') return '#9e9e9e';
    if (record.done) return '#2e7d32';
    return '#ff6b35';
  },

  statusIcon(record) {
    if (record.status === 'cancelled') return '⚪';
    if (record.done) return '✅';
    return '⏳';
  },

  getRecordAtHour(isoDate, hour) {
    return this.recordsForDate(isoDate).find(r => {
      const [h, m] = (r.time || '00:00').split(':').map(Number);
      const startMin = h * 60 + m;
      const duration = r.duration || 60;
      const checkMin = hour * 60;
      return checkMin >= startMin && checkMin < startMin + duration;
    });
  },

  render() {
    const container = document.getElementById('scheduleContent');
    if (!container) return;
    container.innerHTML = this.renderHeader() + (this.viewMode === 'day' ? this.renderDay() : this.renderWeek());
  },

  renderHeader() {
    let label = '';
    if (this.viewMode === 'day') {
      const d = new Date(this.currentDate);
      const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      label = `${dayNames[d.getDay()]}, ${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}`;
      if (this.currentDate === Utils.todayISO()) label += ' (сегодня)';
    } else {
      const mon = this.currentWeekStart;
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      label = `${Utils.formatDate(mon.toISOString()).slice(0, 5)} — ${Utils.formatDate(sun.toISOString()).slice(0, 5)}`;
    }

    return `
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="chip ${this.viewMode === 'day' ? 'active' : ''}" style="flex:1;text-align:center;" onclick="Schedule.setView('day')">📅 День</button>
          <button class="chip ${this.viewMode === 'week' ? 'active' : ''}" style="flex:1;text-align:center;" onclick="Schedule.setView('week')">📆 Неделя</button>
          <button class="icon-btn" onclick="Schedule.openSettings()" style="background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:8px 12px;">⚙️</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-card);border-radius:10px;padding:10px 14px;">
          <button class="icon-btn" onclick="Schedule.prev()" style="font-size:20px;">‹</button>
          <div style="font-weight:600;font-size:14px;text-align:center;">${label}</div>
          <button class="icon-btn" onclick="Schedule.next()" style="font-size:20px;">›</button>
        </div>
      </div>
    `;
  },

  setView(mode) { this.viewMode = mode; this.render(); },

  prev() {
    if (this.viewMode === 'day') {
      const d = new Date(this.currentDate);
      d.setDate(d.getDate() - 1);
      this.currentDate = this.toISODate(d);
    } else {
      const d = new Date(this.currentWeekStart);
      d.setDate(d.getDate() - 7);
      this.currentWeekStart = d;
    }
    this.render();
  },

  next() {
    if (this.viewMode === 'day') {
      const d = new Date(this.currentDate);
      d.setDate(d.getDate() + 1);
      this.currentDate = this.toISODate(d);
    } else {
      const d = new Date(this.currentWeekStart);
      d.setDate(d.getDate() + 7);
      this.currentWeekStart = d;
    }
    this.render();
  },

renderDay() {
    const isoDate = this.currentDate;
    const todayISO = Utils.todayISO();
    const nowMinutes = new Date().getHours() * 60 + new Date().getMinutes();
    const isToday = isoDate === todayISO;
    const hours = this.getHoursForDate(isoDate);

    if (hours.off) {
      return `<div style="background:var(--bg-input);border-radius:10px;padding:40px 20px;text-align:center;"><div style="font-size:48px;margin-bottom:12px;">🛌</div><div style="font-size:16px;font-weight:600;margin-bottom:6px;">Выходной день</div><button class="btn-secondary" onclick="Schedule.openSettings()">⚙️ Изменить</button></div>`;
    }

    const totalMinutes = (hours.end - hours.start) * 60;
    const records = this.recordsForDate(isoDate);
    const busyMinutes = records.filter(r => r.status !== 'cancelled').reduce((sum, r) => sum + (r.duration || 60), 0);
    const freeMinutes = Math.max(0, totalMinutes - busyMinutes);

    const fmtMin = (m) => {
      const h = Math.floor(m / 60);
      const mm = m % 60;
      if (h === 0) return `${mm} мин`;
      if (mm === 0) return `${h} ч`;
      return `${h} ч ${mm} мин`;
    };

    let html = `<div style="background:var(--bg-input);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;font-size:12px;flex-wrap:wrap;gap:6px;">
      <span>🟧 Занято: <b>${fmtMin(busyMinutes)}</b></span>
      <span>🟢 Свободно: <b>${fmtMin(freeMinutes)}</b></span>
      <span>👥 Записей: <b>${records.length}</b></span>
    </div>`;

    const SLOT = 30;
    const startMin = hours.start * 60;
    const endMin = hours.end * 60;

    for (let m = startMin; m < endMin; m += SLOT) {
      const h = Math.floor(m / 60);
      const min = m % 60;
      const timeStr = `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
      const slotEnd = m + SLOT;

      // Ищем запись, начавшуюся ИМЕННО в этом слоте
      const record = records.find(r => {
        const [rh, rm] = (r.time || '00:00').split(':').map(Number);
        const rStart = rh * 60 + rm;
        return rStart === m;
      });

      if (record) {
        const client = State.data.clients.find(c => c.id === record.clientId);
        const clientName = client ? client.name : 'Удалён';
        const color = this.statusColor(record);
        const icon = this.statusIcon(record);
        const duration = record.duration || 60;
        const rStart = m;
        const rEnd = rStart + duration;
        const eH = Math.floor(rEnd / 60);
        const eM = rEnd % 60;
        const endTime = `${String(eH).padStart(2, '0')}:${String(eM).padStart(2, '0')}`;
        const startTime = record.time || '00:00';

        html += `
          <div style="display:flex;gap:8px;margin-bottom:3px;height:44px;">
            <div style="width:52px;flex-shrink:0;font-size:11px;color:var(--text-muted);text-align:right;padding-top:14px;">
              ${timeStr}
            </div>
            <div style="flex:1;background:${color};border-radius:8px;color:#fff;cursor:pointer;padding:6px 10px;overflow:hidden;"
                 onclick="Schedule.openDetail('${record.id}')">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div style="font-weight:600;font-size:13px;">${Utils.escape(clientName)}</div>
                <div style="font-size:13px;">${icon}</div>
              </div>
              <div style="font-size:10px;opacity:0.9;margin-top:1px;">
                ${startTime}–${endTime}${record.note ? ' • ' + Utils.escape(record.note) : ''}
              </div>
            </div>
          </div>
        `;

        // Пропускаем слоты, перекрытые длительностью записи
        const skipUntil = Math.ceil(duration / SLOT) - 1;
        m += skipUntil * SLOT;
        continue;
      }

      // Свободный слот
      const isPast = isToday && slotEnd <= nowMinutes;
      const isNow = isToday && m <= nowMinutes && nowMinutes < slotEnd;
      const bgColor = isPast ? 'var(--bg-input)' : isNow ? 'rgba(255,107,53,0.15)' : 'var(--success-bg)';
      const borderColor = isPast ? 'var(--border)' : isNow ? 'var(--accent)' : 'var(--success)';
      const textColor = isPast ? 'var(--text-muted)' : 'var(--success)';
      const label = isPast ? '— прошло' : isNow ? '— сейчас' : 'свободно';

      html += `
        <div style="display:flex;gap:8px;margin-bottom:3px;height:44px;">
          <div style="width:52px;flex-shrink:0;font-size:11px;color:var(--text-muted);text-align:right;padding-top:14px;">
            ${timeStr}
          </div>
          <div style="flex:1;background:${bgColor};border:1.5px dashed ${borderColor};border-radius:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:${textColor};font-size:12px;padding:6px 12px;"
               onclick="Schedule.openForm(null, '${isoDate}', ${h}, ${min})">
            <span>${label}</span>
            ${!isPast ? '<span style="font-weight:600;font-size:16px;">+</span>' : ''}
          </div>
        </div>
      `;
    }
    return html;
  },

  renderWeek() {
    const monday = this.currentWeekStart;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }
    const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const todayISO = Utils.todayISO();
    let html = '';

    days.forEach((day, i) => {
      const isoDate = this.toISODate(day);
      const isToday = isoDate === todayISO;
      const records = this.recordsForDate(isoDate);
      const hours = this.getHoursForDate(isoDate);

      if (hours.off) {
        html += `
          <div style="background:var(--bg-card);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border-left:4px solid ${isToday ? 'var(--accent)' : 'transparent'};opacity:0.6;" onclick="Schedule.openDayFromWeek('${isoDate}')">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="font-weight:600;font-size:14px;${isToday ? 'color:var(--accent);' : ''}">${dayNames[i]}, ${day.getDate()}.${String(day.getMonth() + 1).padStart(2, '0')}${isToday ? ' • сегодня' : ''}</div>
              <div style="font-size:13px;color:var(--text-muted);">🛌 выходной</div>
            </div>
          </div>
        `;
        return;
      }

      const total = hours.end - hours.start;
      const busy = records.filter(r => r.status !== 'cancelled').reduce((sum, r) => sum + Math.ceil((r.duration || 60) / 60), 0);
      const free = Math.max(0, total - busy);

      let slotBar = '';
      for (let h = hours.start; h < hours.end; h++) {
        const rec = this.getRecordAtHour(isoDate, h);
        const color = rec ? this.statusColor(rec) : 'var(--success-bg)';
        slotBar += `<div style="flex:1;background:${color};height:100%;border-radius:2px;margin:0 0.5px;"></div>`;
      }

      html += `
        <div style="background:var(--bg-card);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border-left:4px solid ${isToday ? 'var(--accent)' : 'transparent'};" onclick="Schedule.openDayFromWeek('${isoDate}')">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="font-weight:600;font-size:14px;${isToday ? 'color:var(--accent);' : ''}">${dayNames[i]}, ${day.getDate()}.${String(day.getMonth() + 1).padStart(2, '0')}${isToday ? ' • сегодня' : ''}</div>
            <div style="font-size:12px;color:var(--text-muted);">${records.length ? `👥 ${records.length} • 🟢 ${free} своб.` : '— пусто —'}</div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:4px;"><span><b>${hours.start}:00</b></span><span><b>${hours.end}:00</b></span></div>
          <div style="display:flex;height:8px;margin-bottom:8px;">${slotBar}</div>
          <div style="display:flex;gap:8px;font-size:11px;color:var(--text-muted);flex-wrap:wrap;">
            <span style="display:inline-flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--success-bg);border:1px solid var(--border);"></span>свободно</span>
            <span style="display:inline-flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#ff6b35;"></span>план</span>
            <span style="display:inline-flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#2e7d32;"></span>проведена</span>
          </div>
        </div>
      `;
    });

    const allWeekRecords = (State.data.schedule || []).filter(s => {
      const d = new Date(s.date);
      return d >= monday && d < new Date(monday.getTime() + 7 * 24 * 60 * 60 * 1000);
    });

    let totalHours = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const h = this.getHoursForDate(this.toISODate(d));
      if (!h.off) totalHours += (h.end - h.start);
    }

    const busyWeekHours = allWeekRecords.filter(r => r.status !== 'cancelled').reduce((sum, r) => sum + Math.ceil((r.duration || 60) / 60), 0);
    const loadPercent = totalHours > 0 ? Math.round((busyWeekHours / totalHours) * 100) : 0;

    return `
      <div style="background:var(--bg-input);border-radius:10px;padding:12px 14px;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span>📊 Загрузка недели</span><b style="color:var(--accent);">${loadPercent}%</b></div>
        <div style="background:var(--border);height:6px;border-radius:3px;overflow:hidden;"><div style="background:var(--accent);height:100%;width:${loadPercent}%;"></div></div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">Занято: ${busyWeekHours} ч из ${totalHours} ч</div>
      </div>
      ${html}
    `;
  },

  openDayFromWeek(isoDate) {
    this.currentDate = isoDate;
    this.viewMode = 'day';
    this.render();
  },

  openSettings() {
    const wh = State.data.settings.workHours || this.DEFAULT_HOURS;
    const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const order = [1, 2, 3, 4, 5, 6, 0];

    const rows = order.map(dow => {
      const h = wh[dow] || { start: 9, end: 20, off: false };
      return `
        <div style="background:var(--bg-input);border-radius:10px;padding:10px 12px;margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <b style="font-size:14px;">${dayNames[dow]}</b>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);">
              <input type="checkbox" id="wh${dow}off" ${h.off ? 'checked' : ''} style="width:auto;" onchange="Schedule.toggleDayOff(${dow}, this.checked)">
              Выходной
            </label>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;${h.off ? 'opacity:0.4;pointer-events:none;' : ''}" id="wh${dow}row">
            <div><label style="font-size:11px;color:var(--text-muted);">С</label><input type="number" id="wh${dow}start" min="0" max="23" value="${h.start}" style="width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;"></div>
            <div><label style="font-size:11px;color:var(--text-muted);">До</label><input type="number" id="wh${dow}end" min="1" max="24" value="${h.end}" style="width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;"></div>
          </div>
        </div>
      `;
    }).join('');

    Modal.open({
      title: '⚙️ Рабочие часы',
      body: `<p style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Настройте часы для каждого дня. Сохранится на все недели.</p>${rows}`,
      footer: `<button class="btn-secondary" onclick="Modal.close()">Отмена</button><button class="btn-primary" onclick="Schedule.saveSettings()">💾 Сохранить</button>`
    });
  },

  toggleDayOff(dow, checked) {
    const row = document.getElementById('wh' + dow + 'row');
    if (row) { row.style.opacity = checked ? '0.4' : '1'; row.style.pointerEvents = checked ? 'none' : 'auto'; }
  },

  saveSettings() {
    const wh = {};
    let error = false;
    [1, 2, 3, 4, 5, 6, 0].forEach(dow => {
      const start = parseInt(document.getElementById('wh' + dow + 'start').value) || 9;
      const end = parseInt(document.getElementById('wh' + dow + 'end').value) || 20;
      const off = document.getElementById('wh' + dow + 'off').checked;
      if (!off && start >= end) { Toast.show(`⚠️ ${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][dow]}: начало раньше конца`); error = true; return; }
      wh[dow] = { start, end, off };
    });
    if (error) return;
    State.data.settings.workHours = wh;
    State.save();
    Modal.close();
    this.render();
    Toast.show('✅ Сохранено');
  },

  openForm(recordId, presetDate, presetHour) {
    const isEdit = !!recordId;
    const record = isEdit
      ? (State.data.schedule || []).find(r => r.id === recordId)
      : { clientId: '', date: presetDate || Utils.todayISO(), time: presetHour != null ? `${String(presetHour).padStart(2, '0')}:00` : '10:00', duration: 60, note: '', done: false, status: 'planned' };

    if (!record) return;

    const clientOptions = State.data.clients.filter(c => (c.status || 'active') === 'active').map(c => `<option value="${c.id}" ${c.id === record.clientId ? 'selected' : ''}>${Utils.escape(c.name)}</option>`).join('');

    Modal.open({
      title: isEdit ? 'Редактировать' : 'Новая запись',
      body: `
        <div class="form-group"><label>Клиент *</label><select id="scClient"><option value="">— выберите —</option>${clientOptions}</select></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="form-group"><label>Дата</label><input id="scDate" type="date" value="${record.date}"></div>
          <div class="form-group"><label>Время</label><input id="scTime" type="time" value="${record.time || '10:00'}"></div>
        </div>
        <div class="form-group"><label>Длительность</label><select id="scDuration"><option value="30" ${record.duration === 30 ? 'selected' : ''}>30 мин</option><option value="60" ${!record.duration || record.duration === 60 ? 'selected' : ''}>1 час</option><option value="90" ${record.duration === 90 ? 'selected' : ''}>1.5 часа</option><option value="120" ${record.duration === 120 ? 'selected' : ''}>2 часа</option></select></div>
        <div class="form-group"><label>Заметка</label><input id="scNote" value="${Utils.escape(record.note || '')}" placeholder="Например: Верх тела"></div>
        <div class="form-group"><label>Статус</label><select id="scStatus"><option value="planned" ${(!record.status || record.status === 'planned') ? 'selected' : ''}>⏳ Запланирована</option><option value="done" ${record.done ? 'selected' : ''}>✅ Проведена</option><option value="cancelled" ${record.status === 'cancelled' ? 'selected' : ''}>⚪ Отменена</option></select></div>
      `,
      footer: `
        ${isEdit ? `<button class="btn-danger" onclick="Schedule.delete('${recordId}')">🗑</button>` : ''}
        <button class="btn-secondary" onclick="Modal.close()">Отмена</button>
        <button class="btn-primary" onclick="Schedule.save('${recordId || ''}')">Сохранить</button>
      `
    });
  },

  save(recordId) {
    const clientId = document.getElementById('scClient').value;
    const date = document.getElementById('scDate').value;
    const time = document.getElementById('scTime').value;
    const duration = parseInt(document.getElementById('scDuration').value) || 60;
    const note = document.getElementById('scNote').value.trim();
    const status = document.getElementById('scStatus').value;
    const done = status === 'done';

    if (!clientId) { Toast.show('⚠️ Выберите клиента'); return; }
    if (!date) { Toast.show('⚠️ Выберите дату'); return; }

    const client = State.data.clients.find(c => c.id === clientId);
    const data = { clientId, clientName: client ? client.name : '', date, time, duration, note, done, status };

    if (!State.data.schedule) State.data.schedule = [];

    if (recordId) {
      const idx = State.data.schedule.findIndex(r => r.id === recordId);
      if (idx !== -1) State.data.schedule[idx] = { ...State.data.schedule[idx], ...data };
      Toast.show('✅ Обновлено');
    } else {
      State.data.schedule.push({ id: Utils.uid(), ...data, createdAt: new Date().toISOString() });
      Toast.show('✅ Запись добавлена');
    }

    State.save();
    Modal.close();
    this.render();
    if (typeof Dashboard !== 'undefined') Dashboard.render();
  },

  delete(recordId) {
    Modal.confirm('Удалить запись?', () => {
      State.data.schedule = (State.data.schedule || []).filter(r => r.id !== recordId);
      State.save();
      Modal.close();
      this.render();
      if (typeof Dashboard !== 'undefined') Dashboard.render();
      Toast.show('🗑 Удалено');
    });
  },

  openDetail(recordId) {
    const record = (State.data.schedule || []).find(r => r.id === recordId);
    if (!record) return;
    const c = State.data.clients.find(x => x.id === record.clientId);
    const duration = record.duration || 60;
    const [startH, startM] = (record.time || '00:00').split(':').map(Number);
    const totalMin = startH * 60 + startM + duration;
    const endH = Math.floor(totalMin / 60);
    const endM = totalMin % 60;
    const timeRange = `${String(startH).padStart(2, '0')}:${String(startM).padStart(2, '0')}–${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
    const statusText = record.status === 'cancelled' ? '⚪ Отменена' : record.done ? '✅ Проведена' : '⏳ Запланирована';

    Modal.open({
      title: `📅 ${record.date}`,
      body: `
        <div class="badge badge-accent">${c ? Utils.escape(c.name) : 'Клиент удалён'}</div>
        <div class="badge">${statusText}</div>
        <div style="background:var(--bg-input);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;"><b>Время:</b> ${timeRange}<br><b>Длительность:</b> ${duration} мин</div>
        ${record.note ? `<div style="background:var(--bg-input);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px;">📝 ${Utils.escape(record.note)}</div>` : ''}
        <div style="margin-top:16px;"><div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Сдвинуть:</div><div style="display:flex;gap:8px;"><button class="btn-ghost" style="flex:1;" onclick="Schedule.shiftTime('${recordId}', -30)">← −30</button><button class="btn-ghost" style="flex:1;" onclick="Schedule.shiftTime('${recordId}', 30)">+30 →</button></div></div>
      `,
      footer: `
        <button class="btn-danger" onclick="Schedule.delete('${recordId}')">🗑</button>
        <button class="btn-secondary" onclick="Modal.close(); Schedule.openForm('${recordId}')">✏️</button>
        <button class="btn-primary" onclick="Schedule.toggleDone('${recordId}')">${record.done ? '⏳ Снять' : '✅ Проведена'}</button>
      `
    });
  },

  shiftTime(recordId, deltaMinutes) {
    const record = (State.data.schedule || []).find(r => r.id === recordId);
    if (!record) return;
    const hours = this.getHoursForDate(record.date);
    const [h, m] = (record.time || '10:00').split(':').map(Number);
    const totalMin = h * 60 + m + deltaMinutes;
    if (totalMin < hours.start * 60) { Toast.show(`⚠️ Рано (с ${hours.start}:00)`); return; }
    if (totalMin + (record.duration || 60) > hours.end * 60) { Toast.show(`⚠️ Поздно (до ${hours.end}:00)`); return; }
    const newH = Math.floor(totalMin / 60);
    const newM = totalMin % 60;
    record.time = `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
    State.save();
    Modal.close();
    this.render();
    if (typeof Dashboard !== 'undefined') Dashboard.render();
    Toast.show(`⏰ ${deltaMinutes > 0 ? '+' : ''}${deltaMinutes} мин`);
  },

  toggleDone(recordId) {
    const record = (State.data.schedule || []).find(r => r.id === recordId);
    if (!record) return;
    record.done = !record.done;
    record.status = record.done ? 'done' : 'planned';
    State.save();
    Modal.close();
    this.render();
    if (typeof Dashboard !== 'undefined') Dashboard.render();
    Toast.show(record.done ? '✅ Проведена' : '⏳ Снята отметка');
  }
};

/* ==================== ДАШБОРД ==================== */
const Dashboard = {

  render() {
    const dateEl = document.getElementById('dashDate');
    const contentEl = document.getElementById('dashContent');
    if (!dateEl || !contentEl) return;

    const now = new Date();
    const dayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const monthNames = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    dateEl.textContent = `📅 ${dayNames[now.getDay()]}, ${now.getDate()} ${monthNames[now.getMonth()]}`;

    const todayISO = Utils.todayISO();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowISO = this.dateToISO(tomorrow);

    // ============ СЕГОДНЯ ============
    const todayRecords = (State.data.schedule || [])
      .filter(r => r.date === todayISO && r.status !== 'cancelled')
      .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    // Будущие (не начались)
    const upcoming = todayRecords.filter(r => {
      const [h, m] = (r.time || '00:00').split(':').map(Number);
      return (h * 60 + m) >= nowMinutes;
    });

    const todayHours = Schedule.getHoursForDate(todayISO);
    const todayBusy = todayRecords.reduce((sum, r) => sum + Math.ceil((r.duration || 60) / 60), 0);
    const todayFreeAfterNow = this.countFreeAfterNow(todayISO, nowMinutes);

    let todayBlock = '';
    if (todayHours.off) {
      todayBlock = `<div class="dash-block"><div class="dash-block-title">СЕГОДНЯ</div><div style="text-align:center;padding:16px;color:var(--text-muted);font-size:14px;">🛌 Выходной</div></div>`;
    } else if (!upcoming.length) {
      const doneCount = todayRecords.filter(r => r.done).length;
      todayBlock = `
        <div class="dash-block">
          <div class="dash-block-title">СЕГОДНЯ</div>
          <div style="padding:8px 0;">
            <div class="dash-big-number">🎉 Всё на сегодня</div>
            <div style="font-size:13px;color:var(--text-muted);margin-top:6px;">
              Проведено: ${doneCount} ${Utils.plural(doneCount, 'тренировка', 'тренировки', 'тренировок')}
            </div>
          </div>
        </div>
      `;
    } else {
      const next = upcoming[0];
      const rest = upcoming.slice(1, 3);
      const nextClient = State.data.clients.find(c => c.id === next.clientId);
      const nextName = nextClient ? nextClient.name : 'Клиент';
      const muscles = this.getMusclesForClient(next.clientId);

      todayBlock = `
        <div class="dash-block">
          <div class="dash-block-title">СЕГОДНЯ</div>
          <div style="font-size:14px;margin-bottom:8px;">
            Осталось: <b>${upcoming.length}</b> ${Utils.plural(upcoming.length, 'тренировка', 'тренировки', 'тренировок')}
          </div>
          <div class="dash-next">
            <div class="dash-next-label">⏭ Следующая</div>
            <div class="dash-next-time">${next.time || ''}</div>
            <div class="dash-next-name">${Utils.escape(nextName)}</div>
            ${muscles ? `<div class="dash-next-muscles">${Utils.escape(muscles)}</div>` : ''}
          </div>
          ${rest.length ? `
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin:10px 0 4px;">Потом</div>
            <ul class="dash-small-list">
              ${rest.map(r => {
                const c = State.data.clients.find(x => x.id === r.clientId);
                return `<li><b>${r.time || ''}</b> ${Utils.escape(c ? c.name : 'Клиент')}</li>`;
              }).join('')}
            </ul>
          ` : ''}
          <div style="font-size:12px;color:var(--success);margin-top:10px;">
            🟢 Свободно с текущего момента: <b>${todayFreeAfterNow}</b>
          </div>
          <button class="dash-link" onclick="App.goTo('schedule')">Открыть расписание →</button>
        </div>
      `;
    }

    // ============ ЗАВТРА ============
    const tomorrowHours = Schedule.getHoursForDate(tomorrowISO);
    let tomorrowBlock = '';

    if (tomorrowHours.off) {
      // Ищем следующий рабочий день
      let nextWorkDay = new Date(tomorrow);
      let nextWorkISO = tomorrowISO;
      let nextWorkName = '';
      const dn = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      for (let i = 0; i < 7; i++) {
        nextWorkDay.setDate(nextWorkDay.getDate() + 1);
        nextWorkISO = this.dateToISO(nextWorkDay);
        const h = Schedule.getHoursForDate(nextWorkISO);
        if (!h.off) { nextWorkName = dn[nextWorkDay.getDay()]; break; }
      }
      const nextRecords = (State.data.schedule || []).filter(r => r.date === nextWorkISO && r.status !== 'cancelled');
      const nextH = Schedule.getHoursForDate(nextWorkISO);
      const nextTotal = nextH.end - nextH.start;
      const nextBusy = nextRecords.reduce((sum, r) => sum + Math.ceil((r.duration || 60) / 60), 0);
      const nextFree = Math.max(0, nextTotal - nextBusy);

      tomorrowBlock = `
        <div class="dash-block">
          <div class="dash-block-title">ЗАВТРА</div>
          <div style="font-size:15px;margin-bottom:10px;">🛌 Выходной</div>
          <div style="font-size:13px;color:var(--text-muted);">Следующий рабочий: <b>${nextWorkName} (${Utils.formatDate(nextWorkISO + 'T00:00:00').slice(0, 5)})</b></div>
          <div style="font-size:13px;margin-top:6px;">📅 ${nextRecords.length} ${Utils.plural(nextRecords.length, 'запись', 'записи', 'записей')} • 🟢 ${nextFree} окон</div>
          <button class="dash-link" onclick="App.goTo('schedule')">Открыть неделю →</button>
        </div>
      `;
    } else {
      const tomorrowRecords = (State.data.schedule || []).filter(r => r.date === tomorrowISO && r.status !== 'cancelled');
      const tomorrowTotal = tomorrowHours.end - tomorrowHours.start;
      const tomorrowBusy = tomorrowRecords.reduce((sum, r) => sum + Math.ceil((r.duration || 60) / 60), 0);
      const tomorrowFree = Math.max(0, tomorrowTotal - tomorrowBusy);

      tomorrowBlock = `
        <div class="dash-block">
          <div class="dash-block-title">ЗАВТРА</div>
          <div class="dash-big-number">${tomorrowRecords.length}</div>
          <div style="font-size:13px;color:var(--text-muted);">${Utils.plural(tomorrowRecords.length, 'тренировка', 'тренировки', 'тренировок')}</div>
          <div style="font-size:13px;color:var(--success);margin-top:6px;">🟢 ${tomorrowFree} свободных окон</div>
          <button class="dash-link" onclick="Dashboard.openTomorrow()">Открыть завтра →</button>
        </div>
      `;
    }

    // ============ ДО КОНЦА НЕДЕЛИ ============
    const weekEnd = this.getSunday();
    const weekEndISO = this.dateToISO(weekEnd);
    const weekRecords = (State.data.schedule || []).filter(r => {
      return r.date >= todayISO && r.date <= weekEndISO && r.status !== 'cancelled';
    });

    // Свободные окна до конца недели
    let weekFreeSlots = 0;
    const cur = new Date(now);
    while (this.dateToISO(cur) <= weekEndISO) {
      const iso = this.dateToISO(cur);
      const h = Schedule.getHoursForDate(iso);
      if (!h.off) {
        const dayRecords = (State.data.schedule || []).filter(r => r.date === iso && r.status !== 'cancelled');
        const dayBusy = dayRecords.reduce((sum, r) => sum + Math.ceil((r.duration || 60) / 60), 0);
        const dayTotal = h.end - h.start;
        weekFreeSlots += Math.max(0, dayTotal - dayBusy);
      }
      cur.setDate(cur.getDate() + 1);
    }

    const weekBlock = `
      <div class="dash-block">
        <div class="dash-block-title">ДО КОНЦА НЕДЕЛИ</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <div>
            <div class="dash-big-number">${weekRecords.length}</div>
            <div style="font-size:12px;color:var(--text-muted);">${Utils.plural(weekRecords.length, 'запись', 'записи', 'записей')}</div>
          </div>
          <div style="text-align:right;">
            <div class="dash-big-number" style="color:var(--success);">${weekFreeSlots}</div>
            <div style="font-size:12px;color:var(--text-muted);">свободных окон</div>
          </div>
        </div>
        <button class="dash-link" onclick="App.goTo('schedule'); Schedule.setView('week')">Открыть неделю →</button>
      </div>
    `;

    // ============ БЫСТРЫЕ ДЕЙСТВИЯ ============
    // Ищем активную запись (сейчас ±20 минут от начала)
    const activeRecord = this.findActiveRecord(nowMinutes);
    const workoutBtnText = activeRecord
      ? `🏋️ Начать: ${Utils.escape(activeRecord.clientName || 'клиент')} (${activeRecord.time})`
      : '🏋️ Начать тренировку';
    const workoutBtnClass = activeRecord ? 'btn-primary btn-block btn-with-icon dash-btn-pulse' : 'btn-primary btn-block btn-with-icon';

    const actionsBlock = `
      <div class="dash-block">
        <div class="dash-block-title">БЫСТРЫЕ ДЕЙСТВИЯ</div>
        <div class="quick-actions" style="margin-top:0;">
          <button class="btn-secondary btn-block btn-with-icon" onclick="Schedule.openForm()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/>
            </svg>
            <span>Новая запись</span>
          </button>
          <button class="${workoutBtnClass}" onclick="Dashboard.startWorkout()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 4v16M18 4v16M6 12h12M3 8v8M21 8v8"/>
            </svg>
            <span>${workoutBtnText}</span>
          </button>
        </div>
      </div>
    `;

    // ============ ИНФОРМАЦИЯ ============
    const infoItems = [];

    // Следующий клиент
    if (upcoming.length) {
      const next = upcoming[0];
      const nextClient = State.data.clients.find(c => c.id === next.clientId);
      const muscles = this.getMusclesForClient(next.clientId);
      infoItems.push(`
        <li>
          <span class="dash-info-icon">⏭</span>
          <div>
            <b>Следующий: ${nextClient ? Utils.escape(nextClient.name) : 'Клиент'}, ${next.time || ''}</b>
            ${muscles ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${Utils.escape(muscles)}</div>` : ''}
          </div>
        </li>
      `);
    }

    // Кто давно не был (7+ дней)
    const sevenDaysAgo = new Date(now);
    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
    const sevenDaysAgoISO = this.dateToISO(sevenDaysAgo);

    const absentClients = State.data.clients.filter(c => {
      if ((c.status || 'active') !== 'active') return false;
      const lastWorkout = State.data.workouts
        .filter(w => w.clientId === c.id)
        .sort((a, b) => new Date(b.date) - new Date(a.date))[0];
      if (!lastWorkout) return false;
      return this.dateToISO(new Date(lastWorkout.date)) < sevenDaysAgoISO;
    }).slice(0, 3);

    absentClients.forEach(c => {
      const lastWorkout = State.data.workouts
        .filter(w => w.clientId === c.id)
        .sort((a, b) => new Date(b.date) - new Date(a.date))[0];
      const daysAgo = Math.floor((now - new Date(lastWorkout.date)) / (1000 * 60 * 60 * 24));
      infoItems.push(`
        <li>
          <span class="dash-info-icon">⚠️</span>
          <div><b>${Utils.escape(c.name)}</b> — не был ${daysAgo} ${Utils.plural(daysAgo, 'день', 'дня', 'дней')}</div>
        </li>
      `);
    });

    const infoBlock = infoItems.length ? `
      <div class="dash-block">
        <div class="dash-block-title">ИНФОРМАЦИЯ</div>
        <ul class="dash-info-list">
          ${infoItems.join('')}
        </ul>
      </div>
    ` : `
      <div class="dash-block">
        <div class="dash-block-title">ИНФОРМАЦИЯ</div>
        <div style="text-align:center;padding:12px;color:var(--text-muted);font-size:13px;">✅ Всё в порядке — все клиенты активны</div>
      </div>
    `;

    contentEl.innerHTML = todayBlock + tomorrowBlock + weekBlock + actionsBlock + infoBlock;
  },

  dateToISO(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  },

  getSunday() {
    const d = new Date();
    const day = d.getDay();
    const diff = day === 0 ? 0 : 7 - day;
    d.setDate(d.getDate() + diff);
    return d;
  },

  // Считаем свободные часы с текущего момента до конца рабочего дня
  countFreeAfterNow(isoDate, nowMinutes) {
    const hours = Schedule.getHoursForDate(isoDate);
    if (hours.off) return 0;

    const nowHour = Math.floor(nowMinutes / 60);
    let free = 0;

    for (let h = Math.max(hours.start, nowHour); h < hours.end; h++) {
      const rec = Schedule.getRecordAtHour(isoDate, h);
      if (!rec) free++;
    }
    return free;
  },

  // Название тренировки + мышцы из программы клиента
  getMusclesForClient(clientId) {
    const c = State.data.clients.find(x => x.id === clientId);
    if (!c || !c.days || !c.days.length) return '';

    const day = c.days[0];
    if (!day.blocks || !day.blocks.length) return '';

    const musclesSet = new Set();
    day.blocks.forEach(block => {
      if (block.type === 'single' && block.exerciseId) {
        const ex = State.data.exercises.find(e => e.id === block.exerciseId);
        if (ex && ex.muscles) {
          ex.muscles.split(',').forEach(m => musclesSet.add(m.trim()));
        }
      } else if (block.type === 'superset') {
        [block.exA, block.exB].forEach(id => {
          const ex = State.data.exercises.find(e => e.id === id);
          if (ex && ex.muscles) {
            ex.muscles.split(',').forEach(m => musclesSet.add(m.trim()));
          }
        });
      }
    });

    const muscles = [...musclesSet].slice(0, 4).join(' · ');
    const dayName = day.name || 'Тренировка';

    return muscles ? `${dayName} (${muscles})` : dayName;
  },

  // Активная запись (±20 минут от текущего времени)
  findActiveRecord(nowMinutes) {
    const todayISO = Utils.todayISO();
    const records = (State.data.schedule || [])
      .filter(r => r.date === todayISO && r.status !== 'cancelled' && !r.done);

    return records.find(r => {
      const [h, m] = (r.time || '00:00').split(':').map(Number);
      const startMin = h * 60 + m;
      const duration = r.duration || 60;
      const endMin = startMin + duration;

      // Если сейчас ±20 мин от начала, или уже идёт
      return (nowMinutes >= startMin - 20 && nowMinutes <= endMin);
    });
  },

  startWorkout() {
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const activeRecord = this.findActiveRecord(nowMinutes);

    if (activeRecord) {
      // Сразу запускаем тренировку с этим клиентом
      Workout.start(activeRecord.clientId);
    } else {
      // Открываем выбор клиента
      const clients = State.data.clients.filter(c => (c.status || 'active') === 'active');
      if (!clients.length) {
        Toast.show('⚠️ Нет активных клиентов');
        return;
      }

      Modal.open({
        title: 'Выберите клиента',
        body: `
          <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Нет активной записи. Выберите клиента вручную:</p>
          ${clients.map(c => `
            <button class="btn-secondary btn-block" style="margin-bottom:8px;text-align:left;padding:12px 16px;"
                    onclick="Modal.close(); Workout.start('${c.id}')">
              ${Utils.escape(c.name)}
            </button>
          `).join('')}
        `,
        footer: `<button class="btn-secondary btn-block" onclick="Modal.close()">Отмена</button>`
      });
    }
  },

  openTomorrow() {
    const now = new Date();
    now.setDate(now.getDate() + 1);
    Schedule.currentDate = this.dateToISO(now);
    Schedule.viewMode = 'day';
    App.goTo('schedule');
  }
};

/* ==================== ЭКСПОРТ / ИМПОРТ ==================== */
const Exporter = {
  exportAll() {
    const data = JSON.stringify(State.data, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `trainer_backup_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    State.data.settings.lastBackup = Date.now();
    State.save();
    Toast.show('💾 Бэкап сохранён');
  },

  exportWorkout(workoutId) {
    const w = State.data.workouts.find(x => x.id === workoutId);
    if (!w) return;
    const totalVolume = w.results.reduce((sum, r) => sum + r.sets.reduce((s, set) => s + (set.weight || 0) * (set.reps || 0), 0), 0);

    let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;font-size:11pt;color:#222}h1{font-size:18pt;color:#ff6b35;border-bottom:2px solid #ff6b35;padding-bottom:6px}.meta{color:#666;font-size:10pt;margin-bottom:12px}.ex-block{margin-bottom:18px}.ex-title{font-weight:bold;font-size:12pt;margin-bottom:4px}.ex-target{color:#888;font-size:9pt;margin-bottom:6px}table{border-collapse:collapse;width:100%;margin:8px 0}th{background:#f0f0f0;padding:6px 10px;text-align:left;font-size:10pt;border:1px solid #ccc}td{padding:6px 10px;border:1px solid #ddd;font-size:10pt}.footer{margin-top:30px;font-size:9pt;color:#888;text-align:center}</style></head><body><h1>🏋️ Отчёт</h1><div class="meta"><b>Клиент:</b> ${Utils.escape(w.clientName)}<br><b>Дата:</b> ${Utils.formatDate(w.date)}<br>${w.dayName ? '<b>День:</b> ' + Utils.escape(w.dayName) + '<br>' : ''}<b>Объём:</b> ${Math.round(totalVolume)} кг</div>`;

    w.results.forEach((r, idx) => {
      html += `<div class="ex-block"><div class="ex-title">${idx + 1}. ${Utils.escape(r.name)}</div><div class="ex-target">Цель: ${r.repsTarget} × ${r.totalSets}</div><table><tr><th style="width:60px;">Подход</th><th style="width:100px;">Вес</th><th style="width:100px;">Повторы</th></tr>${r.sets.map((s, i) => `<tr><td>${i + 1}${s.phase ? ' (' + s.phase + ')' : ''}</td><td>${s.weight != null ? s.weight : '—'}</td><td>${s.reps != null ? s.reps : '—'}</td></tr>`).join('')}</table></div>`;
    });

    html += `<div class="footer">Приложение «Тренер» • ${Utils.formatDate(new Date().toISOString())}</div></body></html>`;
    this.download(html, `Тренировка_${w.clientName}_${Utils.formatDate(w.date).replace(/\./g, '-')}.doc`);
  },

  download(html, filename) {
    const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    Toast.show('📄 Файл сохранён');
  }
};

const Importer = {
  trigger() {
    let input = document.getElementById('importFileInput');
    if (!input) {
      input = document.createElement('input');
      input.type = 'file';
      input.id = 'importFileInput';
      input.accept = '.json,application/json';
      input.style.display = 'none';
      input.addEventListener('change', (e) => this.onFile(e));
      document.body.appendChild(input);
    }
    input.click();
  },

  async onFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const stats = { clients: (data.clients || []).length, exercises: (data.exercises || []).length, workouts: (data.workouts || []).length };

      Modal.confirm(`Заменить текущие данные?\n\nВ файле: ${stats.clients} клиентов, ${stats.exercises} упражнений, ${stats.workouts} тренировок.\n\n⚠️ Текущие данные будут удалены!`, () => {
        State.data.clients = data.clients || [];
        State.data.exercises = data.exercises || [];
        State.data.workouts = data.workouts || [];
        State.data.schedule = data.schedule || [];
        if (data.settings) State.data.settings = { ...State.data.settings, ...data.settings };
        State.save();
        Toast.show('✅ Данные восстановлены');
        App.refreshAll();
      });
    } catch (err) {
      Toast.show('❌ Не удалось прочитать файл');
    } finally {
      event.target.value = '';
    }
  }
};

const BackupReminder = {
  DAYS: 7,
  check() {
    const last = State.data.settings.lastBackup;
    if (!last || (Date.now() - last) > this.DAYS * 24 * 60 * 60 * 1000) {
      setTimeout(() => this.showBanner(), 3000);
    }
  },
  showBanner() {
    const old = document.getElementById('backupBanner');
    if (old) old.remove();
    const banner = document.createElement('div');
    banner.id = 'backupBanner';
    banner.style.cssText = `position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:2px solid var(--accent);border-radius:12px;padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:500;max-width:90vw;font-size:13px;display:flex;gap:10px;align-items:center;`;
    banner.innerHTML = `<div style="flex:1;">💾 <b>Пора сделать бэкап!</b><br><span style="color:var(--text-muted);font-size:12px;">Данные не сохранялись больше недели</span></div><button class="btn-primary" style="padding:8px 12px;font-size:12px;" onclick="Exporter.exportAll(); BackupReminder.dismiss()">Сделать</button><button class="icon-btn" onclick="BackupReminder.dismiss()">✕</button>`;
    document.body.appendChild(banner);
  },
  dismiss() {
    const b = document.getElementById('backupBanner');
    if (b) b.remove();
  }
};

const App = {
  currentTab: 'dashboard',

  init() {
    State.init();
    this.applyTheme();
    this.bindAll();
    this.goTo('dashboard');
    this.updateStats();
    Clients.render();
    Library.render();
    History.render();
    Schedule.init();
    Dashboard.render();
    BackupReminder.check();
    console.log('✅ Приложение запущено');
  },

  goTo(tab) {
    this.currentTab = tab;
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

    const tabEl = document.getElementById('tab-' + tab);
    if (tabEl) tabEl.classList.add('active');
    document.querySelectorAll(`.nav-btn[data-tab="${tab}"]`).forEach(el => el.classList.add('active'));

    document.body.setAttribute('data-tab', tab);

    if (tab === 'dashboard') Dashboard.render();
    if (tab === 'clients') Clients.render();
    if (tab === 'library') Library.render();
    if (tab === 'history') History.render();
    if (tab === 'schedule') Schedule.render();

    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  bindAll() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => this.goTo(btn.dataset.tab));
    });

    document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());
    document.getElementById('settingsBtn').addEventListener('click', () => Settings.open());
    document.getElementById('modalClose').addEventListener('click', () => Modal.close());
    document.getElementById('addClientBtn').addEventListener('click', () => Clients.openForm());
    document.getElementById('addExerciseBtn').addEventListener('click', () => Library.openForm());
    document.getElementById('addScheduleBtn').addEventListener('click', () => Schedule.openForm());
    document.getElementById('progressOverallBtn').addEventListener('click', () => Progress.showOverall());

    Clients.bindSearch();
    Library.bindSearch();
  },

  toggleTheme() {
    State.data.settings.theme = State.data.settings.theme === 'dark' ? 'light' : 'dark';
    State.save();
    this.applyTheme();
    // Обновляем модалку настроек, если открыта
    if (!document.getElementById('modal').classList.contains('hidden')) {
      Settings.open();
    }
  },

  applyTheme() {
    const theme = State.data.settings.theme || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  },

  updateStats() {
    const el1 = document.getElementById('statClients');
    const el2 = document.getElementById('statExercises');
    const el3 = document.getElementById('statWorkouts');
    if (el1) el1.textContent = State.data.clients.length;
    if (el2) el2.textContent = State.data.exercises.length;
    if (el3) el3.textContent = State.data.workouts.length;
  },

  refreshAll() {
    this.updateStats();
    Clients.render();
    Library.render();
    History.render();
    Schedule.render();
    Dashboard.render();
    this.applyTheme();
  }
};

  };

  // Добавляем кнопку в карточку клиента
  const _origOpenDetail = Clients.openDetail;
  Clients.openDetail = function(id) {
    _origOpenDetail.call(this, id);

    // Вставляем кнопку PDF в футер карточки
    setTimeout(() => {
      const footer = document.getElementById('modalFooter');
      if (!footer) return;
      if (footer.querySelector('.btn-pdf-program')) return;

      const btn = document.createElement('button');
      btn.className = 'btn-ghost btn-pdf-program';
      btn.textContent = '📄 PDF';
      btn.title = 'Программа для клиента';
      btn.onclick = () => { Modal.close(); setTimeout(() => openDaySelector(id), 100); };

      // Вставляем перед кнопкой "Программа" или "Тренировка"
      const programBtn = [...footer.querySelectorAll('button')].find(b => b.textContent.includes('Программа'));
      if (programBtn) {
        footer.insertBefore(btn, programBtn);
      } else {
        footer.appendChild(btn);
      }
    }, 100);
  };

console.log('✅ Патч: PDF-программа клиента загружена');
})();
</script>
</body>
</html>
